name: DGI weekly production SEO quality gate
on:
  schedule:
    - cron: "35 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/weekly-production-seo.yml
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: dgi-production-weekly-seo
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ymaslen77-tech/dgi-court-importer
          ref: infra/coolify-russian-vps
          persist-credentials: false
      - name: Install HTML parser
        run: python3 -m pip install --user beautifulsoup4==4.14.2
      - name: Check config and scan all live pages, sitemap and links
        id: seo
        continue-on-error: true
        run: |
          python3 -m json.tool config/weekly-seo-audit.json >/dev/null
          python3 -m py_compile scripts/weekly_seo_audit.py
          python3 scripts/weekly_seo_audit.py
      - name: Compare sitemap and metadata against previous complete audit
        id: compare
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_seo_compare_reports.py' -v
          previous="$(gh run list --repo "$GH_REPO" --workflow weekly-production-seo.yml --limit 12 --json databaseId,status \
            | jq -r --argjson current "$GITHUB_RUN_ID" '[.[] | select(.status == "completed" and .databaseId != $current)][0].databaseId // empty')"
          if [[ -z "$previous" ]]; then
            echo '{"status":"no_previous_run","release_review_required":false,"automatic_publication_allowed":false}' > test-results/seo-regressions.json
            echo "No baseline run: fresh inventory stored for next week."
            exit 0
          fi
          mkdir -p /tmp/previous-seo
          gh run download "$previous" --repo "$GH_REPO" -n dgi-weekly-seo-report -D /tmp/previous-seo
          python3 scripts/seo_compare_reports.py --previous /tmp/previous-seo/weekly-seo.json \
            --current test-results/weekly-seo.json --output test-results/seo-regressions.json
      - name: Save full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgi-weekly-seo-report
          path: |
            test-results/weekly-seo.json
            test-results/seo-regressions.json
          if-no-files-found: warn
          retention-days: 30
      - name: Create or update SEO incident
        if: steps.seo.outcome == 'failure' || steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          f=Path("test-results/weekly-seo.json")
          stats=json.loads(f.read_text())["stats"] if f.exists() else {"error":"audit did not produce a report"}
          title="DGI: weekly production SEO regression detected"
          body="SEO audit detected problems. Inspect current Actions artifacts before changing URLs, redirects, metadata or legal content.\n\n"+json.dumps(stats,ensure_ascii=False,indent=2)+"\n\n"+os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          q=subprocess.run(["gh","issue","list","--state","open","--search",title,"--json","number,title"],capture_output=True,text=True,check=True)
          existing=next((row for row in json.loads(q.stdout) if row["title"]==title),None)
          if existing:subprocess.run(["gh","issue","comment",str(existing["number"]),"--body",body],check=True)
          else:subprocess.run(["gh","issue","create","--title",title,"--body",body],check=True)
          PY
      - name: Fail if confirmed SEO defects exist
        if: steps.seo.outcome == 'failure'
        run: exit 1

# Integration check: downstream SEO fix PR workflow reacts only to audited, verified link candidates.
