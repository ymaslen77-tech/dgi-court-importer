name: Court ZIP ingestion unit tests

on:
  pull_request:
    paths:
      - "court_catalog.py"
      - "tests/test_court_catalog.py"
      - ".github/workflows/moscow-housing-court-catalog.yml"
      - ".github/workflows/court-zip-tests.yml"
  push:
    branches: [main]
    paths:
      - "court_catalog.py"
      - "tests/test_court_catalog.py"
      - ".github/workflows/moscow-housing-court-catalog.yml"
      - ".github/workflows/court-zip-tests.yml"

permissions:
  contents: read

jobs:
  court-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ijson
      - name: Validate streamed plain and ZIP official datasets
        run: python -m unittest tests.test_court_catalog -v
