name: DGI Google TXT DNS verification
on:
  push:
    branches: [ops/check-google-dns-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-google-dns.mjs
