name: Prepare and publish verified official court text reading copies
on:
  workflow_dispatch:
  push:
    branches: [infra/coolify-russian-vps]
    paths: [.github/workflows/publish-verified-court-copy.yml]
permissions:
  contents: write
concurrency:
  group: dgi-verified-court-copy-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: infra/coolify-russian-vps
      - name: Install PDF and HTML inspection requirements
        shell: bash
        run: |
          python -m pip -q install beautifulsoup4 lxml reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core >/dev/null
      - name: Fetch and inspect full anonymized official court decision
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-official-court-pdf-copies.py --repo-root .
          python3 - <<'PY'
          import json,pathlib,subprocess,hashlib
          cases=json.loads(pathlib.Path("apps/web/src/data/verified-court-static.json").read_text())
          expected={"88-5020/2026","88-12184/2026","88-12218/2026","88-5408/2026"}
          assert len(cases)==4
          assert {c["case_number"] for c in cases} == expected
          for case in cases:
            assert 7500 < len(case["full_text"]) < 90000
            assert case["full_text"].rstrip().endswith("Судьи")
            assert case["case_number"] in case["full_text"][:600]
            assert case["outcome_verified"]=="applicant_granted"
            assert len(case["outcome_evidence"]) >= 40
            pdf=pathlib.Path("apps/web/public/court-pdf-copies")/(case["slug"]+".pdf")
            assert pdf.exists() and pdf.stat().st_size>1000
            assert hashlib.sha256(pdf.read_bytes()).hexdigest()==case["pdf_sha256"]
            info=subprocess.run(["pdfinfo",str(pdf)],capture_output=True,text=True,check=True)
            assert "Pages:" in info.stdout
            out=subprocess.run(["pdftotext","-layout",str(pdf),"-"],capture_output=True,text=True,check=True).stdout
            for phrase in [case["case_number"],"судебная коллегия","Судьи"]:
              assert phrase.lower() in out.lower(), f"Missing act segment in PDF: {case['case_number']} {phrase}"
            print("VALIDATED_PDF",case["case_number"], [line for line in info.stdout.splitlines() if line.startswith("Pages:")][0],
                  "text_SHA256",case["full_text_sha256"][:16],"pdf_SHA256",case["pdf_sha256"][:16])
          print("Only applicant-favorable judicial PDF copies checked")
          PY
      - name: Commit first checked PDF court act to the web release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch apps/web/public/court-pdf-copies/2kas-88-14012-2026-2026-05-21.pdf
          git add apps/web/src/data/verified-court-static.json apps/web/public/court-pdf-copies
          if git diff --cached --quiet; then
            echo 'Verified copy already published in repository'
            exit 0
          fi
          git commit -m 'data(courts): first verified official full-text ruling with labeled PDF reading copy'
          git pull --rebase origin infra/coolify-russian-vps
          git push origin HEAD:infra/coolify-russian-vps
