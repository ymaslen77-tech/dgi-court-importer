name: DGI court data — staged import
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Max records to stage as drafts (1-1000)'
        default: '50'
        required: false
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
      COURT_DATASET_URL: ${{ vars.COURT_DATASET_URL }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Check configuration
        shell: bash
        run: |
          test -n "$WEBFLOW_TOKEN" || { echo 'Missing WEBFLOW_TOKEN secret'; exit 1; }
          test -n "$COURT_DATASET_URL" || { echo 'Missing COURT_DATASET_URL variable (direct JSON URL)'; exit 1; }
      - name: Download official JSON export
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request
          from importer import dataset_url
          url = os.environ['COURT_DATASET_URL']
          if not dataset_url(url):
              raise SystemExit('Expected a direct court-case dataset URL, not /api/opendata/json registry export')
          request = urllib.request.Request(url,headers={'User-Agent':'DGI-court-research/1.0'})
          with urllib.request.urlopen(request,timeout=120) as stream, open('court-data.json','wb') as out:
              while chunk := stream.read(1024*1024):
                  out.write(chunk)
          print('Official JSON export downloaded; schema validation is next')
          PY
      - name: Import only draft candidates
        run: python importer.py --input court-data.json --download-url "$COURT_DATASET_URL" --limit "$BATCH_SIZE" --upload
