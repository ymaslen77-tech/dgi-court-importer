name: Official Moscow court ZIP integration smoke

on:
  push:
    branches: [fix/court-zip-and-legal-seo-gates-20261020]
    paths:
      - ".github/workflows/court-real-export-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  read-only-court-export:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      COURT_DATASET_URL: ${{ vars.COURT_DATASET_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ijson
      - name: Download official export without publishing
        shell: bash
        run: |
          python - <<'PY'
          import os,urllib.request
          from importer import dataset_url
          u=os.getenv("COURT_DATASET_URL") or ""
          if not dataset_url(u) or "/opendata/" not in u:
              raise SystemExit("Invalid official dataset URL")
          req=urllib.request.Request(u,headers={"User-Agent":"DGI-Research/1.0 (+https://dgi-pravo.ru/)"})
          size=0
          with urllib.request.urlopen(req,timeout=180) as response,open("/tmp/official-export.bin","wb") as out:
              while chunk:=response.read(1024*1024):
                  size+=len(chunk)
                  if size>1_100_000_000: raise SystemExit("Archive too large")
                  out.write(chunk)
          print("Download bytes:",size)
          PY
      - name: Diagnose ZIP safely; do not print case data or personally identifying fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path("/tmp/official-export.bin")
          with p.open("rb") as f: magic=f.read(4)
          print("ZIP signature:", magic==b"PK\\x03\\x04")
          if zipfile.is_zipfile(p):
              with zipfile.ZipFile(p) as z:
                  members=[m for m in z.infolist() if not m.is_dir()]
                  print("Entry count:",len(members))
                  for m in members[:10]:
                      print("Entry metadata:",m.filename[:100],m.file_size,m.compress_size)
          PY
      - name: Parse official ZIP in read-only candidate mode
        run: |
          python court_catalog.py --input /tmp/official-export.bin --source-url "$COURT_DATASET_URL" --output data/court-catalog.jsonl --max-new 2500
