name: VPS migration capability check

on:
  push:
    branches:
      - infra/coolify-russian-vps
    paths:
      - .github/workflows/vps-migration-capability-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-check:
    name: Inspect remote permissions (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secure SSH access to VPS (no changes)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "::error::VPS_SSH_KEY missing"; exit 1; }
          [ -n "${VPS_KNOWN_HOSTS:-}" ] || { echo "::error::VPS_KNOWN_HOSTS missing"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=12 \
            -i "$HOME/.ssh/id_deploy" gha-deploy@79.133.181.192 \
            'set -eu; echo "User: $(id -un)"; echo "Groups: $(id -Gn)"; \
             if docker info >/dev/null 2>&1; then echo "Docker access: yes"; else echo "Docker access: no"; fi; \
             if sudo -n true 2>/dev/null; then echo "Passwordless sudo: yes"; else echo "Passwordless sudo: no"; fi; \
             if command -v pg_dump >/dev/null; then echo "Postgres tools: installed"; else echo "Postgres tools: absent"; fi; \
             df -h / | tail -n 1'
