name: Probe verified Moscow news sources and editorial model
on:
  workflow_dispatch:
  push:
    branches: [infra/coolify-russian-vps]
    paths: [.github/workflows/probe-news-publishing.yml]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe official agency headlines and model access
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install -q beautifulsoup4 lxml
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          from bs4 import BeautifulSoup
          pages=[
            "https://mosreg.ru/sobytiya/novosti?tags_ids=14985",
            "https://mosreg.ru/sobytiya/novosti?tags_ids=15175",
            "https://mosreg.ru/sobytiya/novosti/organy/ministerstvo-zhilischno-kommunalnogo-hozyayst?page=1",
            "https://social.mosreg.ru/news/index",
            "https://tender.mos.ru/press-center/"
          ]
          for url in pages:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; housing-news-audit/1.0)'})
              with urllib.request.urlopen(req,timeout=15) as r:raw=r.read(1300000)
              soup=BeautifulSoup(raw,'lxml')
              links=[]
              for a in soup.select('a[href]'):
                href=a.get('href','')
                label=' '.join(a.get_text(' ',strip=True).split())
                if len(label)>28 and ('/sobytiya/novosti/' in href or '/news/' in href or '/press-center/' in href):
                  links.append((label[:90],href[:120]))
              print('SOURCE',url,'raw_bytes',len(raw),'candidates',len(links),'sample',repr(links[:4]))
            except Exception as e:print('SOURCE_ERROR',url,type(e).__name__)
          url='https://models.github.ai/inference/chat/completions'
          req=urllib.request.Request(url,method='POST',headers={
            'Authorization':'Bearer '+os.environ['GH_MODELS_TOKEN'],
            'Accept':'application/vnd.github+json','Content-Type':'application/json'},
            data=json.dumps({'model':'openai/gpt-4.1-mini','messages':[{'role':'user','content':'Ответь одним словом: ГОТОВО'}],'max_tokens':40}).encode())
          try:
            with urllib.request.urlopen(req,timeout=20) as r:
              body=json.load(r)
              print('MODEL_AVAILABLE',r.status,'has_choice',bool(body.get('choices')))
          except urllib.error.HTTPError as e: print('MODEL_UNAVAILABLE','HTTP',e.code)
          except Exception as e:print('MODEL_UNAVAILABLE',type(e).__name__)
          PY
