name: DGI all public page responsive sweep
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/all-pages-responsive.cjs'
      - '.github/workflows/dgi-all-pages-responsive.yml'
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit all static pages
        run: node tests/all-pages-responsive.cjs
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-pages-responsive
          path: test-results/all-pages-responsive.json
          if-no-files-found: warn
