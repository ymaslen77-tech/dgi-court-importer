name: Housing-law news research — read-only
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum research candidates (1-50)'
        type: number
        default: 15
permissions:
  contents: read
jobs:
  scan-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEWS_LIMIT: ${{ github.event.inputs.limit || '15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Read-only RSS research, never upload to old CMS
        run: python news_importer.py --limit "$NEWS_LIMIT"
