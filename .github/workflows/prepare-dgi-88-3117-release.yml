name: Prepare DGI 88-3117 positive court act on automation PR branch only
on:
  push:
    branches:
      - automation/dgi-court-88-3117-20261028
    paths:
      - scripts/prepare-dgi-88-3117-release.py
      - .github/workflows/prepare-dgi-88-3117-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dgi-88-3117-prepare-safe-branch
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/automation/dgi-court-88-3117-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/dgi-court-88-3117-20261028
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up PDF and official court text tooling
        run: |
          python -m pip install --disable-pip-version-check -q beautifulsoup4 lxml reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core >/dev/null
      - name: Fail closed unless official current full text passes exact-reviewed-hash and privacy checks
        run: python3 scripts/prepare-dgi-88-3117-release.py
      - name: Commit only validated court copy and curated manifest to automation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = automation/dgi-court-88-3117-20261028
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/data/verified-court-static.json apps/web/public/court-pdf-copies/2kas-88-3117-2026-2026-02-19.pdf
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'data(courts): stage official 88-3117 full-text PDF for protected PR review'
          git push origin HEAD:automation/dgi-court-88-3117-20261028
          echo 'Prepared on automation branch only; CI/PR/verified Coolify release still required'
