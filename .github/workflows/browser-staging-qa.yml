name: Browser QA — Next.js migration

on:
  push:
    branches: [feature/nextjs-webflow-migration]
    paths:
      - "apps/web/**"
      - "migration/**"
      - ".github/workflows/browser-staging-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      SITE_CUTOVER: "false"
      SITE_RELEASE_APPROVED: "no"
      CMS_PUBLIC_READS: "false"
      COURT_DB_READS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Archive generated pnpm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-generated
          path: pnpm-lock.yaml
          retention-days: 3
      - name: Pin generated workspace lock (migration branch only)
        if: github.ref == 'refs/heads/feature/nextjs-webflow-migration'
        run: |
          test -s pnpm-lock.yaml
          if ! git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            git add pnpm-lock.yaml
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(deps): pin pnpm dependency tree'
            git push origin HEAD:feature/nextjs-webflow-migration
          fi
      - name: Build private staging preview
        run: pnpm --filter @dgi/web build
      - name: Install Chromium
        run: pnpm --filter @dgi/web exec playwright install --with-deps chromium
      - name: Test 33 pages and 22 archive URLs on desktop/mobile
        run: pnpm --filter @dgi/web test:e2e
      - name: Preserve failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: apps/web/test-results/
          retention-days: 7
