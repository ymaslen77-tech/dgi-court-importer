name: DGI public production HTTP smoke — published site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/production-http-smoke.mjs"
      - "scripts/seo-live-audit.mjs"
      - ".github/workflows/production-http-smoke.yml"
  push:
    branches: [infra/coolify-russian-vps]
    paths:
      - "scripts/production-http-smoke.mjs"
      - "scripts/seo-live-audit.mjs"
      - ".github/workflows/production-http-smoke.yml"
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'infra/coolify-russian-vps' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Track the source commit audited
        run: echo "SEO_AUDITED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify published Coolify HTTP, robots, sitemap, HTML, and PDFs
        run: node scripts/production-http-smoke.mjs
      - name: Preserve HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgi-production-http
          path: |
            test-results/production-http-smoke.json
            test-results/seo-live-audit.json
          retention-days: 14
