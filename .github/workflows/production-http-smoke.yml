name: DGI public production HTTP smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/production-http-smoke.mjs"
      - ".github/workflows/production-http-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/production-http-smoke.mjs"
      - ".github/workflows/production-http-smoke.yml"
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public Vercel production route, indexing gates and editorial address
        run: node scripts/production-http-smoke.mjs
      - name: Preserve HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgi-production-http
          path: test-results/production-http-smoke.json
          retention-days: 14
