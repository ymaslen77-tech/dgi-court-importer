name: DGI official court daily preparation (10 verified maximum)
on:
  push:
    branches:
      - 'automation/dgi-daily-*'
    paths:
      - 'research/dgi-daily-trigger-*.json'
      - 'research/dgi-court-publication-queue-*.json'
      - 'config/dgi-daily-publication.json'
      - 'config/dgi-automation-approval-policy.json'
      - 'scripts/prepare_dgi_all_outcome_courts.py'
      - 'scripts/validate_dgi_court_publication_queue.py'
      - 'scripts/tests/test_dgi_court_daily_preparation.py'
      - '.github/workflows/dgi-all-outcome-courts-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dgi-court-prep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: research-and-prepare-dgi-court-acts
    if: startsWith(github.ref, 'refs/heads/automation/dgi-daily-')
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official-source parser and PDF-copy tooling
        run: |
          python3 -m pip install --disable-pip-version-check -q beautifulsoup4 lxml reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core poppler-utils >/dev/null
      - name: Verify source queue and ten-act ceiling
        run: |
          python3 scripts/validate_dgi_court_publication_queue.py
          python3 -m unittest discover -s scripts/tests -p 'test_dgi_court_daily_preparation.py' -v
      - name: Prepare source-checked cases on disposable runner (no GitHub writes)
        run: python3 scripts/prepare_dgi_all_outcome_courts.py
      - name: Verify post-import queue and all PDF reading copies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_dgi_court_publication_queue.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          repo=Path('.')
          policy=json.loads((repo/'config/dgi-daily-publication.json').read_text())
          report=json.loads((repo/'test-results/dgi-court-daily-status.json').read_text())
          goal=policy['publication_limits']['new_verified_court_acts_per_run']
          assert goal==10 and 0<=report['new_prepared_count']<=goal
          assert report['daily_verified_target']==goal
          assert report['daily_target_shortfall']==goal-report['new_prepared_count']
          data=json.loads((repo/'apps/web/src/data/verified-court-static.json').read_text())
          assert len({x['case_number'] for x in data})==len(data)
          assert len({x['official_url'] for x in data})==len(data)
          for row in data:
              pdf=repo/'apps/web/public/court-pdf-copies'/ (row['slug']+'.pdf')
              b=pdf.read_bytes()
              assert b.startswith(b'%PDF-') and hashlib.sha256(b).hexdigest()==row['pdf_sha256'],row['slug']
              assert hashlib.sha256(row['full_text'].encode()).hexdigest()==row['full_text_sha256'],row['slug']
              if row.get('privacy_screen_passed'):
                  text=subprocess.run(['pdftotext',str(pdf),'-'],capture_output=True,text=True,check=True).stdout
                  assert row['case_number'] in text and len(text)>3500,row['slug']
          print('COURT_PREPARATION_VALID',len(data),'new',report['new_prepared_count'],'shortfall',report['daily_target_shortfall'])
          PY
      - name: Save source-checked candidate package for protected PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgi-daily-court-preparation-${{ github.run_id }}
          path: |
            test-results/dgi-court-daily-status.json
            research/dgi-court-import-report-2026-10-28.json
            research/dgi-court-publication-queue-2026-10-28.json
            apps/web/src/data/verified-court-static.json
            apps/web/public/court-pdf-copies/*.pdf
          retention-days: 14
          if-no-files-found: warn
      - name: Protect the production branch and publication workflow
        run: |
          echo 'Runner was read-only: no direct push, no auto-approved cases, no Coolify deployment.'
          echo 'Only an automation/dgi-* PR with final-head CI may publish prepared content.'
