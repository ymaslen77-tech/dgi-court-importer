name: DGI responsive and browser smoke test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/browser-responsive.cjs'
      - '.github/workflows/browser-responsive.yml'
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Inspect live site
        run: node tests/browser-responsive.cjs
        env:
          DGI_SITE_URL: https://dgimos.webflow.io
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit
          path: test-results/responsive-audit.json
          if-no-files-found: warn
