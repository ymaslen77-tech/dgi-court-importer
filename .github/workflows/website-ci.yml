name: Next.js migration checks

on:
  push:
    branches:
      - feature/nextjs-webflow-migration
    paths:
      - "apps/web/**"
      - "db/**"
      - "scripts/export-webflow.mjs"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "db/**"
      - "scripts/export-webflow.mjs"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/website-ci.yml"

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate migration inventory
        run: pnpm test
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Compile Next.js
        env:
          SITE_CUTOVER: "false"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
