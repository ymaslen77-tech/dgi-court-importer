services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-housing}
      POSTGRES_USER: ${POSTGRES_USER:-housing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - housing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-housing} -d ${POSTGRES_DB:-housing}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  housing_pgdata:
